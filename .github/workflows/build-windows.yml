name: Build Windows DLL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'ue4ss-def/**'
      - '.github/workflows/build-windows.yml'

env:
  # The mod imports UE4SS symbols at load time, so the headers it compiles
  # against must come from the same UE4SS revision the target server runs.
  # c838a8ac is the build behind UE4SS.dll sha256 d0107f63e567313c...
  UE4SS_REPO: npc0-hue/RE-UE4SS
  # Private submodule holding the Unreal headers the UE4SS public headers need.
  # npc0-hue/RE-UE4SS is public, so reading it probes nothing; only this
  # private repository proves the credential grants the access the build needs.
  UEPSS_REPO: Re-UE4SS/UEPseudo
  UE4SS_REF: c838a8acaade1a0f860bdf249f039e58f4e10088

jobs:
  build:
    runs-on: windows-2022
    env:
      # Either credential is enough. Whichever one can read both repositories
      # is selected, so a broken or unprivileged primary does not block the
      # other. A user-scoped credential is required because the private headers
      # live in a different repository than npc0-hue/RE-UE4SS.
      UE4SS_SSH_KEY: ${{ secrets.UE4SS_SSH_KEY || secrets.UEPSS_DEPLOY_KEY }}
      UE4SS_PAT: ${{ secrets.UE4SS_PAT }}

    steps:
      - uses: actions/checkout@v4

      - name: Select credential
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Test-Remote([string]$Remote) {
            $null = (git ls-remote $Remote HEAD 2>&1 | Out-String)
            return ($LASTEXITCODE -eq 0)
          }

          $sshReady = $false
          $sshDir = Join-Path $env:RUNNER_TEMP 'ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = Join-Path $sshDir 'ue4ss_key'

          if ($env:UE4SS_SSH_KEY) {
            Write-Host "::warning::UE4SS_SSH_KEY is set: $($env:UE4SS_SSH_KEY.Length) characters"

            # A key pasted through the web UI can arrive with CRLF line endings,
            # which OpenSSH rejects as "invalid format". Normalise the line
            # endings and make sure the blob ends with a newline before writing.
            $raw = $env:UE4SS_SSH_KEY
            $hasBegin = $raw.Contains('BEGIN OPENSSH PRIVATE KEY')
            $hasEnd = $raw.Contains('END OPENSSH PRIVATE KEY')
            $keyText = ($raw -replace "`r`n", "`n") -replace "`r", "`n"
            $keyText = $keyText.Trim() + "`n"

            [IO.File]::WriteAllText($keyPath, $keyText, (New-Object Text.UTF8Encoding($false)))
            icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null

            # Validate before relying on it. A malformed key only disables the
            # SSH path; it must not stop the token path from being tried.
            $derived = (ssh-keygen -y -f $keyPath 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::UE4SS_SSH_KEY is not a usable OpenSSH private key, so the SSH path is skipped"
              Write-Host "::warning::ssh-keygen said: $derived"
              if (-not $hasBegin -or -not $hasEnd) {
                Write-Host "::warning::the value does not contain the BEGIN and END lines, so it is probably a token pasted into the wrong secret"
              }
              if ($env:UE4SS_SSH_KEY.Trim().Length -eq 40) {
                Write-Host "::warning::40 characters is the length of a classic personal access token, not of an OpenSSH private key"
              }
              $sshReady = $false
            }
            else {
              $fp = (ssh-keygen -lf $keyPath 2>&1 | Out-String).Trim()
              Write-Host "::warning::ssh key fingerprint: $fp"

              $env:GIT_SSH_COMMAND = 'ssh -i "{0}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new' -f $keyPath
              "UE4SS_KEY_PATH=$keyPath" | Add-Content -LiteralPath $env:GITHUB_ENV

              # ssh -T reports success through the greeting but exits non-zero,
              # so only the text matters here.
              $greeting = (ssh -i $keyPath -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -T git@github.com 2>&1 | Out-String).Trim()
              Write-Host "::warning::ssh identity: $greeting"

              $sshRepo = Test-Remote "git@github.com:$env:UE4SS_REPO.git"
              $uepRepo = Test-Remote "git@github.com:$env:UEPSS_REPO.git"
              $sshReady = $sshRepo -and $uepRepo
              Write-Host "::warning::ssh reads $($env:UE4SS_REPO): $sshRepo"
              Write-Host "::warning::ssh reads $($env:UEPSS_REPO): $uepRepo"
            }
          }
          else {
            Write-Host '::warning::ssh: no secret named UE4SS_SSH_KEY'
          }

          $httpsReady = $false
          if ($env:UE4SS_PAT) {
            Write-Host "::warning::UE4SS_PAT is set: $($env:UE4SS_PAT.Length) characters"

            $headers = @{ Authorization = "Bearer $($env:UE4SS_PAT)"; 'User-Agent' = 'scum-simple-rcon-ci' }
            try {
              $resp = Invoke-WebRequest -Uri 'https://api.github.com/user' -Headers $headers
              $login = ($resp.Content | ConvertFrom-Json).login
              $scopes = ($resp.Headers['x-oauth-scopes'] -join ',')
              if (-not $scopes) { $scopes = '(none reported)' }
            }
            catch {
              $login = '(lookup failed)'
              $scopes = $_.Exception.Message
            }

            $htRepo = Test-Remote "https://x-access-token:$($env:UE4SS_PAT)@github.com/$env:UE4SS_REPO.git"
            $hueRepo = Test-Remote "https://x-access-token:$($env:UE4SS_PAT)@github.com/$env:UEPSS_REPO.git"
            $httpsReady = $htRepo -and $hueRepo
            Write-Host "::warning::token belongs to: $login"
            Write-Host "::warning::token scopes: $scopes"
            Write-Host "::warning::token reads $($env:UE4SS_REPO): $htRepo"
            Write-Host "::warning::token reads $($env:UEPSS_REPO): $hueRepo"

            if ($httpsReady) {
              $authed = "https://x-access-token:$($env:UE4SS_PAT)@github.com/"
              git config --global "url.$authed.insteadOf" "git@github.com:"
              git config --global "url.$authed.insteadOf" "ssh://git@github.com:"
              git config --global credential.helper ""
            }
          }
          else {
            Write-Host '::warning::token: no secret named UE4SS_PAT'
          }

          git config --global advice.detachedHead false

          if ($sshReady) {
            "UE4SS_AUTH_MODE=ssh" | Add-Content -LiteralPath $env:GITHUB_ENV
            Write-Host 'credential selected: SSH key'
          }
          elseif ($httpsReady) {
            "UE4SS_AUTH_MODE=https" | Add-Content -LiteralPath $env:GITHUB_ENV
            Write-Host 'credential selected: HTTPS token'
          }
          else {
            Write-Host "::error::no credential can read $($env:UEPSS_REPO)"
            Write-Host '::error::That repository is private, so the credential must belong to an account that can read it.'
            Write-Host '::error::Fix either secret under Settings -> Secrets and variables -> Actions:'
            Write-Host '::error::  UE4SS_PAT      = a classic PAT with repo scope created by an account that can read it'
            Write-Host '::error::  UE4SS_SSH_KEY  = that account''s private key, including the BEGIN and END lines'
            exit 1
          }

      - name: Check out UE4SS headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:UE4SS_AUTH_MODE -eq 'ssh') {
            $env:GIT_SSH_COMMAND = 'ssh -i "{0}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new' -f $env:UE4SS_KEY_PATH
            $origin = "git@github.com:$env:UE4SS_REPO.git"
          }
          else {
            $origin = "https://x-access-token:$($env:UE4SS_PAT)@github.com/$env:UE4SS_REPO.git"
          }

          $src = Join-Path $env:RUNNER_TEMP 'ue4ss'
          git init --quiet $src
          git -C $src remote add origin $origin
          git -C $src fetch --depth 1 origin $env:UE4SS_REF
          git -C $src checkout --quiet FETCH_HEAD
          # The UE4SS public headers include Unreal headers from this submodule.
          # patternsleuth is not in that closure, so it is left uninitialized.
          # No --depth here: the recorded Unreal commit is an interior commit
          # rather than a branch tip, and the repository is small enough that a
          # full fetch is cheaper than risking a bare-SHA shallow fetch.
          git -C $src submodule update --init deps/first/Unreal

          $header = Join-Path $src 'UE4SS/include/UE4SSRuntime.hpp'
          if (-not (Test-Path $header)) { throw "UE4SS headers missing at $header" }
          $unreal = Join-Path $src 'deps/first/Unreal/include/Unreal/Core/CoreTypes.hpp'
          if (-not (Test-Path $unreal)) { throw "Unreal submodule headers missing at $unreal" }
          "UE4SS_SOURCE_DIR=$src" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DUE4SS_SOURCE_DIR="$env:UE4SS_SOURCE_DIR" `
            -DUE4SS_DEF_FILE="$env:GITHUB_WORKSPACE/ue4ss-def/UE4SS.def"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target scum_simple_rcon

      - name: Collect artifact
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter main.dll |
            Where-Object { $_.FullName -like '*scum_simple_rcon*' } |
            Select-Object -First 1
          if (-not $dll) { throw 'main.dll was not produced' }
          Write-Host "artifact: $($dll.FullName)"
          Write-Host "size: $($dll.Length) bytes"
          Write-Host "sha256: $((Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLower())"
          $out = Join-Path $env:GITHUB_WORKSPACE 'dist/ue4ss/Mods/scum_simple_rcon/dlls'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $dll.FullName $out
          Copy-Item 'ue4ss/Mods/scum_simple_rcon/config.ini' 'dist/ue4ss/Mods/scum_simple_rcon/'
          Copy-Item 'ue4ss/Mods/scum_simple_rcon/enabled.txt' 'dist/ue4ss/Mods/scum_simple_rcon/'

      - uses: actions/upload-artifact@v4
        with:
          name: scum_simple_rcon-ue4ss
          path: dist/ue4ss/Mods/scum_simple_rcon
          if-no-files-found: error
