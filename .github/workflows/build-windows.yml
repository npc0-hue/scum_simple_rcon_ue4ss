name: Build Windows DLL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'ue4ss-def/**'
      - '.github/workflows/build-windows.yml'

env:
  # The mod imports UE4SS symbols at load time, so the headers it compiles
  # against must come from the same UE4SS revision the target server runs.
  # c838a8ac is the build behind UE4SS.dll sha256 d0107f63e567313c...
  UE4SS_REPO: npc0-hue/RE-UE4SS
  # Private submodule holding the Unreal headers the UE4SS public headers need.
  # npc0-hue/RE-UE4SS is public, so a token that can read it still proves
  # nothing about private access; this repository is the real access test.
  UEPSS_REPO: Re-UE4SS/UEPseudo
  UE4SS_REF: c838a8acaade1a0f860bdf249f039e58f4e10088

jobs:
  build:
    runs-on: windows-2022
    env:
      # SSH is preferred: a user-scoped key reaches both repositories, while a
      # repository-scoped deploy key reaches only one. The PAT is kept as a
      # fallback for the case where private-repository access comes from a token.
      UE4SS_SSH_KEY: ${{ secrets.UE4SS_SSH_KEY || secrets.UEPSS_DEPLOY_KEY }}
      UE4SS_PAT: ${{ secrets.UE4SS_PAT }}

    steps:
      - uses: actions/checkout@v4

      - name: Select credential
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:UE4SS_SSH_KEY) {
            Write-Host 'credential: SSH key'

            $sshDir = Join-Path $env:RUNNER_TEMP 'ssh'
            New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
            $keyPath = Join-Path $sshDir 'ue4ss_key'
            Set-Content -LiteralPath $keyPath -Value $env:UE4SS_SSH_KEY -NoNewline -Encoding ascii
            icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null

            $sshCmd = 'ssh -i "{0}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new' -f $keyPath
            $env:GIT_SSH_COMMAND = $sshCmd
            "UE4SS_KEY_PATH=$keyPath" | Add-Content -LiteralPath $env:GITHUB_ENV
            "UE4SS_AUTH_MODE=ssh" | Add-Content -LiteralPath $env:GITHUB_ENV

            $origin = 'git@github.com:{0}.git'
          }
          elseif ($env:UE4SS_PAT) {
            Write-Host 'credential: HTTPS token'

            $authed = "https://x-access-token:$($env:UE4SS_PAT)@github.com/"
            git config --global "url.$authed.insteadOf" "git@github.com:"
            git config --global "url.$authed.insteadOf" "ssh://git@github.com:"
            git config --global credential.helper ""
            "UE4SS_AUTH_MODE=https" | Add-Content -LiteralPath $env:GITHUB_ENV

            $origin = "https://x-access-token:$($env:UE4SS_PAT)@github.com/{0}.git"
          }
          else {
            Write-Host '::error::no credential secret is readable by this workflow'
            Write-Host 'Checked names: UE4SS_SSH_KEY, UEPSS_DEPLOY_KEY, UE4SS_PAT.'
            Write-Host 'Add one of them on npc0-hue/scum_simple_rcon_ue4ss under'
            Write-Host '  Settings -> Secrets and variables -> ACTIONS'
            Write-Host 'That page is separate from Dependabot secrets, and secrets are per repository,'
            Write-Host 'so a secret set on another repository is not visible here.'
            exit 1
          }

          git config --global advice.detachedHead false

          # Name the repository that is unreachable instead of failing opaquely.
          foreach ($repo in @($env:UE4SS_REPO, $env:UEPSS_REPO)) {
            $remote = $origin -f $repo
            $out = (git ls-remote $remote HEAD 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::credential cannot read $repo"
              $shown = $out
              if ($env:UE4SS_PAT) { $shown = $shown -replace [regex]::Escape($env:UE4SS_PAT), '***' }
              Write-Host $shown
              exit 1
            }
            Write-Host "reachable: $repo"
          }

      - name: Check out UE4SS headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:UE4SS_AUTH_MODE -eq 'ssh') {
            $sshCmd = 'ssh -i "{0}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new' -f $env:UE4SS_KEY_PATH
            $env:GIT_SSH_COMMAND = $sshCmd
            $origin = "git@github.com:$env:UE4SS_REPO.git"
          }
          else {
            $origin = "https://x-access-token:$($env:UE4SS_PAT)@github.com/$env:UE4SS_REPO.git"
          }

          $src = Join-Path $env:RUNNER_TEMP 'ue4ss'
          git init --quiet $src
          git -C $src remote add origin $origin
          git -C $src fetch --depth 1 origin $env:UE4SS_REF
          git -C $src checkout --quiet FETCH_HEAD
          # The UE4SS public headers include Unreal headers from this submodule.
          # patternsleuth is not in that closure, so it is left uninitialized.
          # No --depth here: the recorded Unreal commit is an interior commit
          # rather than a branch tip, and the repository is small enough that a
          # full fetch is cheaper than risking a bare-SHA shallow fetch.
          git -C $src submodule update --init deps/first/Unreal

          $header = Join-Path $src 'UE4SS/include/UE4SSRuntime.hpp'
          if (-not (Test-Path $header)) { throw "UE4SS headers missing at $header" }
          $unreal = Join-Path $src 'deps/first/Unreal/include/Unreal/Core/CoreTypes.hpp'
          if (-not (Test-Path $unreal)) { throw "Unreal submodule headers missing at $unreal" }
          "UE4SS_SOURCE_DIR=$src" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DUE4SS_SOURCE_DIR="$env:UE4SS_SOURCE_DIR" `
            -DUE4SS_DEF_FILE="$env:GITHUB_WORKSPACE/ue4ss-def/UE4SS.def"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target scum_simple_rcon

      - name: Collect artifact
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter main.dll |
            Where-Object { $_.FullName -like '*scum_simple_rcon*' } |
            Select-Object -First 1
          if (-not $dll) { throw 'main.dll was not produced' }
          Write-Host "artifact: $($dll.FullName)"
          Write-Host "size: $($dll.Length) bytes"
          Write-Host "sha256: $((Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLower())"
          $out = Join-Path $env:GITHUB_WORKSPACE 'dist/ue4ss/Mods/scum_simple_rcon/dlls'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $dll.FullName $out
          Copy-Item 'ue4ss/Mods/scum_simple_rcon/config.ini' 'dist/ue4ss/Mods/scum_simple_rcon/'
          Copy-Item 'ue4ss/Mods/scum_simple_rcon/enabled.txt' 'dist/ue4ss/Mods/scum_simple_rcon/'

      - uses: actions/upload-artifact@v4
        with:
          name: scum_simple_rcon-ue4ss
          path: dist/ue4ss/Mods/scum_simple_rcon
          if-no-files-found: error
