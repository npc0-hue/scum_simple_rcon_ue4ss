name: Build Windows DLL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'ue4ss-def/**'
      - '.github/workflows/build-windows.yml'

env:
  # The mod imports UE4SS symbols at load time, so the headers it compiles
  # against must come from the same UE4SS revision the target server runs.
  # c838a8ac is the build behind UE4SS.dll sha256 d0107f63e567313c...
  UE4SS_REPO: npc0-hue/RE-UE4SS
  # Private submodule holding the Unreal headers the UE4SS public headers need.
  UEPSS_REPO: Re-UE4SS/UEPseudo
  UE4SS_REF: c838a8acaade1a0f860bdf249f039e58f4e10088

jobs:
  build:
    runs-on: windows-2022
    env:
      # Classic PAT with the 'repo' scope. A user-scoped token reaches both
      # npc0-hue/RE-UE4SS and the private Re-UE4SS/UEPseudo submodule, which a
      # repo-scoped deploy key cannot do in one credential.
      UE4SS_PAT: ${{ secrets.UE4SS_PAT }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure token authentication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:UE4SS_PAT) {
            Write-Host '::error::secret UE4SS_PAT is empty for this repository'
            Write-Host 'Set it on npc0-hue/scum_simple_rcon_ue4ss under Settings -> Secrets and variables -> ACTIONS (not Dependabot secrets).'
            Write-Host 'Use a classic PAT with the repo scope.'
            exit 1
          }
          Write-Host "UE4SS_PAT length: $($env:UE4SS_PAT.Length)"

          # .gitmodules records SSH URLs, so rewrite both SSH forms to an HTTPS
          # URL carrying the token. Submodule fetches then authenticate too.
          $authed = "https://x-access-token:$($env:UE4SS_PAT)@github.com/"
          git config --global url."$authed".insteadOf "git@github.com:"
          git config --global url."$authed".insteadOf "ssh://git@github.com/"
          git config --global credential.helper ""
          git config --global advice.detachedHead false

          # Name the repository that is unreachable instead of failing opaquely.
          foreach ($repo in @($env:UE4SS_REPO, $env:UEPSS_REPO)) {
            $out = (git ls-remote "https://x-access-token:$($env:UE4SS_PAT)@github.com/$repo.git" HEAD 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::token cannot read $repo"
              Write-Host ($out -replace [regex]::Escape($env:UE4SS_PAT), '***')
              exit 1
            }
            Write-Host "reachable: $repo"
          }

      - name: Check out UE4SS headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $src = Join-Path $env:RUNNER_TEMP 'ue4ss'
          git init --quiet $src
          git -C $src remote add origin "https://x-access-token:$($env:UE4SS_PAT)@github.com/$env:UE4SS_REPO.git"
          git -C $src fetch --depth 1 origin $env:UE4SS_REF
          git -C $src checkout --quiet FETCH_HEAD
          # The UE4SS public headers include Unreal headers from this submodule.
          # patternsleuth is not in that closure, so it is left uninitialized.
          git -C $src submodule update --init --depth 1 deps/first/Unreal

          $header = Join-Path $src 'UE4SS/include/UE4SSRuntime.hpp'
          if (-not (Test-Path $header)) { throw "UE4SS headers missing at $header" }
          "UE4SS_SOURCE_DIR=$src" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DUE4SS_SOURCE_DIR="$env:UE4SS_SOURCE_DIR" `
            -DUE4SS_DEF_FILE="$env:GITHUB_WORKSPACE/ue4ss-def/UE4SS.def"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target scum_simple_rcon

      - name: Collect artifact
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter main.dll |
            Where-Object { $_.FullName -like '*scum_simple_rcon*' } |
            Select-Object -First 1
          if (-not $dll) { throw 'main.dll was not produced' }
          Write-Host "artifact: $($dll.FullName)"
          Write-Host "size: $($dll.Length) bytes"
          Write-Host "sha256: $((Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLower())"
          $out = Join-Path $env:GITHUB_WORKSPACE 'dist/ue4ss/Mods/scum_simple_rcon/dlls'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $dll.FullName $out
          Copy-Item 'ue4ss/Mods/scum_simple_rcon/config.ini' 'dist/ue4ss/Mods/scum_simple_rcon/'
          Copy-Item 'ue4ss/Mods/scum_simple_rcon/enabled.txt' 'dist/ue4ss/Mods/scum_simple_rcon/'

      - uses: actions/upload-artifact@v4
        with:
          name: scum_simple_rcon-ue4ss
          path: dist/ue4ss/Mods/scum_simple_rcon
          if-no-files-found: error
